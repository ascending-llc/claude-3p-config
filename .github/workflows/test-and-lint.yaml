name: Unit Test and Lint

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.1"

      # pre-commit runs golangci-lint for make lint.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run unit test
        run: make test

      - name: Lint
        run: make lint

      # Build the native hook before asking it to check Windows source files.
      - name: Lint Windows
        run: GOOS=windows make lint

  # The plutil -lint check of the generated .mobileconfig only runs on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.1"

      - name: Run unit test
        run: make test

  windows:
    runs-on: windows-latest
    env:
      CCWB_REQUIRE_ELEVATED_TESTS: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.1"

      - name: Run unit test
        run: go test ./...
