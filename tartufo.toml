[tool.tartufo]
repo-path = "."
regex = true
entropy = true

exclude-path-patterns = [
    {path-pattern = 'go\.mod$', reason = 'go.mod file'},
    {path-pattern = 'tartufo\.toml$', reason = 'gelato config file'},
]

exclude-entropy-patterns = [
    {pattern = '^\s*<string>[A-Za-z0-9+/]+=*</string>$', path-pattern = 'Codex-CCWB(\.example)?\.mobileconfig$', reason = 'Base64 of the generated Codex TOML, decoded and compared to the TOML files by TestCodexMobileconfigIsValidProfile'},
]

exclude-signatures = [
    {signature = "c639409a63bdcb05792ea9dbfdfc9cf8034f0007408d235ba97d4103d5b4654a", reason = 'Public eclipse-temurin base-image digest pinned in signing/Dockerfile and verified by the container build'},
    {signature = "930c6fceef9ae6bdef1faa5485d1dc34f0369309e895fa5580893df12da6d563", reason = 'Public jsign 7.5 SHA-256 pinned in signing/Dockerfile and verified against the downloaded jar'},
]
