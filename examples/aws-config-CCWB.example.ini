# Claude on Amazon Bedrock. Add to ~/.aws/config (Windows: %USERPROFILE%\.aws\config).

[sso-session ccwb]
sso_start_url = REPLACE_WITH_IAM_IDENTITY_CENTER_START_URL
sso_region = us-east-1
sso_registration_scopes = sso:account:access

[profile CCWB]
sso_session = ccwb
sso_account_id = REPLACE_WITH_12_DIGIT_AWS_ACCOUNT_ID
sso_role_name = REPLACE_WITH_PERMISSION_SET_NAME
region = us-east-1
